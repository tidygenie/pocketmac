# XcodeGen spec for the iPhone app. The GitHub workflow runs `xcodegen generate`
# and builds an unsigned .ipa; sign + install it with Sideloadly or 3uTools.
name: PocketMac
options:
  bundleIdPrefix: com.nareshchoudhary
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  PocketMac:
    type: application
    platform: iOS
    sources:
      - path: PocketMac
      - path: ../Shared
        group: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nareshchoudhary.pocketmac
        PRODUCT_NAME: PocketMac
        INFOPLIST_FILE: PocketMac/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
schemes:
  PocketMac:
    build:
      targets:
        PocketMac: all
    run:
      config: Debug
    archive:
      config: Release
